security: []
paths:
  /idcs:
    get:
      tags:
      - idcs
      summary: List all IDCs
      description: Retrieves a list of IDC information that are not marked as hidden.
      operationId: listIDCs
      responses:
        '200':
          description: Successfully retrieved the list of IDCs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listIDCsResponse'
        '500':
          description: '- [group:**idc**, code:**1201**]: Get IDC list encountered
            DB error.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                Get IDC list encountered DB error:
                  summary: Get IDC list encountered DB error.
                  value:
                    group: idc
                    code: 1201
                    message: Get IDC list encountered DB error.
                    traces:
                    - DB error occurred.
      x-source: https://docs.gmicloud.ai/api-reference/idcs/list-all-idcs.md
  /invitations/{invitationKey}:
    post:
      tags:
      - invitations
      summary: Accept invitation by key
      description: 'Allows user to accept an invitation to join the organization using
        invitationKey. The user will automatically leave their current organization.

        '
      operationId: acceptInvitationByKey
      parameters:
      - name: invitationKey
        in: path
        schema:
          type: string
          example: CB8OZUZQUxddQG9DTAlGXg9Ea0IBV18EQ25FTFhAUVtcakdRU0JVRGUaDxodEwwdNhwLWRNVEToRAlVNSlQKbxFIVxcDTHIRA1oQSlsLPUoHB0FdRD5CUA
        required: true
        description: 'The invitation key for joining an existing organization.

          '
      responses:
        '200':
          description: Successfully accepted the invitation.
        '400':
          description: '- [group:**invitation**, code:**3**]: Invalid invitationKey.

            - [group:**request**, code:**0**]: Invalid field in the request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                Invalid field in the request:
                  summary: Invalid field in the request.
                  value:
                    group: request
                    code: 0
                    validationDetail:
                    - field: invitationKey
                      expression: required
                      originalValue: ''
                      reason: This field is required.
        '403':
          description: '- [group:**invitation**, code:**1**]: The user has no permission
            to access the invitation resources.

            - [group:**invitation**, code:**2**]: The invitation has been revoked.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                The user does not have permission to access invitation resources:
                  summary: The user has no permission to access the invitation resources.
                  value:
                    group: invitation
                    code: 1
                    message: The user has no permission to access invitation resources.
        '404':
          description: '- [group:**organization**, code:**2**]: Organization does
            not exist.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                Organization does not exist:
                  summary: Organization does not exist.
                  value:
                    group: organization
                    code: 2
                    message: Organization does not exist.
        '409':
          description: '- [group:**organization**, code:**0**]: User already owns
            an organization.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                User already owns an organization:
                  summary: The user already owns an organization.
                  value:
                    group: organization
                    code: 0
                    message: User already owns an organization.
        '500':
          description: '- [group:**invitation**, code:**201**]: Get invitation encountered
            error.

            - [group:**organization**, code:**1201**]: Get organization encountered
            DB error.

            - [group:**organization**, code:**1400**]: Update organization grouping
            policy encountered error.

            - [group:**session**, code:**3**]: Failed to save session to cache.

            - [group:**user**, code:**1200**]: Get user encountered DB error.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                Get organization encountered DB error:
                  summary: Get organization encountered DB error.
                  value:
                    group: organization
                    code: 1201
                    message: Get organization encountered DB error.
                    traces:
                    - DB error occurred.
      security:
      - bearerAuth: []
      x-source: https://docs.gmicloud.ai/api-reference/invitations/accept-invitation-by-key.md
  /me/oauth/auth-tokens:
    post:
      tags:
      - me
      summary: Create an auth token via OAuth.
      description: Create a short-term authentication token using a third-party OAuth
        provider (e.g., Google).
