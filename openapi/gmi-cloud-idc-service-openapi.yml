            - [group:**request**, code:**1**]: The request body is required.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                Invalid field in the request body:
                  summary: Invalid field in the request body.
                  value:
                    group: request
                    code: 0
                    validationDetail:
                    - field: provider
                      expression: required
                      originalValue: ''
                      reason: This field is required.
                The request body is required:
                  summary: The request body is required.
                  value:
                    group: request
                    code: 1
                    message: The request body is required.
        '404':
          description: '- [group:**user**, code:**1**]: User does not exist.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                User does not exist:
                  summary: User does not exist.
                  value:
                    group: user
                    code: 0
                    message: User does not exist.
        '500':
          description: '- [group:**oauth**, code:**1000**]: Get user info encountered
            error.

            - [group:**session**, code:**200**]: Failed to create auth token.

            - [group:**session**, code:**201**]: Failed to save auth token data.

            - [group:**user**, code:**1200**]: Get user encountered DB error.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrStatusMsg'
              examples:
                Failed to create auth token:
                  summary: Failed to create auth token.
                  value:
                    group: session
                    code: 200
                    message: Failed to create auth token.
                    traces:
                    - error occurred.
      x-source: https://docs.gmicloud.ai/api-reference/me/create-an-auth-token-via-oauth.md
