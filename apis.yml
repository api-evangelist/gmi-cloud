- aid: gmi-cloud:gmi-cloud-sandbox-files-api
  name: GMI Cloud Sandbox Files API
  description: >-
    Sandbox file data plane (`/files`). **These endpoints are not under `/api/v2`** and do not use `Authorization:
    Bearer`: they are served by the sandbox's own data-plane entry point — clients connect directly to
    `https://{sandbox_key}.{domain}` and authenticate with `X-Access-Token`. `{sandbox_key}` is the `sandbox_key`
    returned by the create/connect endpoints, used for data-plane host addressing. `{domain}` and `X-Access-Token`
    are the `domain` and `sandbox_access_token` from the same responses — no extra endpoint is needed
    to obtain them.


    This split is not historical baggage but the nature of a data plane: file transfer is long-lived,
    high-volume, and addressed per sandbox, differing from the control plane's short requests in both
    capacity model and failure domain, so they do not share an entry point.


    **One unified abstraction.** The same contract is served by two backend kinds (an in-sandbox file
    service / a data-center data-plane proxy); clients need not — and cannot — tell them apart. The cost
    is that the contract is their intersection: `Content-Length` on download and resumable download (`Range`/`206`)
    are **optional capabilities** that vary by data center, and clients must work correctly when they
    are absent. See the per-operation notes below.
  humanURL: https://docs.gmicloud.ai/api-reference/introduction
  baseURL: https://console.gmicloud.ai/api
